# Company configurations for job fetching
# ats: greenhouse | ashby | netflix | zillow | amazon | jsearch | microsoft | uber | walmart | linkedin | capitalone | paypal | github | rippling

companies:

  # ── JSearch (RapidAPI) — requires JSEARCH_API_KEY env var ──────────────────
  # Meta: Playwright gets net::ERR_ABORTED even from a local (non-Fly) IP —
  # looks like headless-browser detection, not IP blocking. Revisit separately.
  - name: Meta
    ats: jsearch
    employer: "Meta"

  # ── Custom HTTP scrapers (SSR pages, no browser needed) ─────────────────────
  - name: Apple
    ats: apple

  - name: Google
    ats: google

  - name: Microsoft
    ats: microsoft

  - name: Uber
    ats: uber

  - name: Walmart
    ats: walmart
    title_keywords:
      - "Manager, Software Engineering"
      - "Director, Software Engineering"
      - "Director, Engineering"

  # ── Greenhouse ──────────────────────────────────────────────────────────────
  - name: DoorDash
    ats: greenhouse
    board_slug: doordashusa

  - name: Dropbox
    ats: greenhouse
    board_slug: dropbox

  - name: AirBnB
    ats: greenhouse
    board_slug: airbnb

  - name: Stripe
    ats: greenhouse
    board_slug: stripe

  - name: Anthropic
    ats: greenhouse
    board_slug: anthropic

  - name: ScaleAI
    ats: greenhouse
    board_slug: scaleai

  - name: Duolingo
    ats: greenhouse
    board_slug: duolingo

  - name: Lyft
    ats: greenhouse
    board_slug: lyft

  - name: StubHub
    ats: greenhouse
    board_slug: stubhubinc

  - name: Spotify
    ats: lever
    board_slug: spotify
    department: Engineering  # Lever caps at 100 results with no pagination; Engineering filter surfaces EM roles

  - name: Instacart
    ats: greenhouse
    board_slug: instacart

  - name: Figma
    ats: greenhouse
    board_slug: figma

  - name: Databricks
    ats: greenhouse
    board_slug: databricks

  - name: Pinterest
    ats: greenhouse
    board_slug: pinterest

  - name: MongoDB
    ats: greenhouse
    board_slug: mongodb

  - name: Twilio
    ats: greenhouse
    board_slug: twilio

  - name: Roblox
    ats: greenhouse
    board_slug: roblox

  - name: HubSpot
    ats: greenhouse
    board_slug: hubspotjobs

  - name: CoreWeave
    ats: greenhouse
    board_slug: coreweave

  # ── Ashby ───────────────────────────────────────────────────────────────────
  - name: OpenAI
    ats: ashby
    board_slug: openai

  - name: Cohere
    ats: ashby
    board_slug: cohere

  - name: Ramp
    ats: ashby
    board_slug: ramp

  - name: Notion
    ats: ashby
    board_slug: notion

  # ── Custom APIs ─────────────────────────────────────────────────────────────
  - name: Netflix
    ats: netflix

  - name: Zillow
    ats: zillow
    fetch_timeout: 60
    title_keywords:
      - "Senior Engineering Manager"
      - "Director of Engineering"
      - "Engineering Director"
    location_filter:
      - "new york"
      - "remote"
      - "seattle"

  - name: Amazon
    ats: amazon
    fetch_timeout: 300
    # Amazon L7 EM titles — "Sr." prefix (with and without period) covers both formats
    title_keywords:
      - "Sr. Software Development Manager"
      - "Sr Software Development Manager"
      - "Senior Engineering Manager"

  # ── LinkedIn (jobs at LinkedIn Inc. only) ───────────────────────────────────
  - name: LinkedIn
    ats: linkedin
    company_id: "1337"

  # ── Capital One (Workday) ────────────────────────────────────────────────────
  - name: Capital One
    ats: capitalone
    # Capital One uses "Manager, Software Engineering" naming instead of "Engineering Manager"
    title_keywords:
      - "Manager, Software Engineering"
      - "Sr. Manager, Software Engineering"
      - "Senior Manager, Software Engineering"
      - "Director, Software Engineering"
      - "Engineering Manager"
      - "Senior Engineering Manager"

  # ── PayPal (Workday) ──────────────────────────────────────────────────────────
  - name: PayPal
    ats: paypal
    # PayPal uses "Manager, Software Engineering" naming instead of "Engineering Manager"
    title_keywords:
      - "Manager, Software Engineering"
      - "Senior Manager, Software Engineering"
      - "Director, Software Engineering"
      - "Engineering Manager"

  # ── GitHub (Jibe/iCIMS careers site) ────────────────────────────────────────
  - name: GitHub
    ats: github

  # ── Rippling (own ATS product, dogfooded for their own hiring) ─────────────
  - name: Rippling
    ats: rippling

  # ── New York Times (Greenhouse) ─────────────────────────────────────────────
  - name: New York Times
    ats: greenhouse
    board_slug: thenewyorktimes
